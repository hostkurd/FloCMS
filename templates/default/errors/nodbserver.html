<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Server Unavailable</title>
    <style>
        body{
            background-color: #ebeff3;
        }
        .wrapper{
            display: flex;
            align-items: flex-start;
            justify-content: center;
            height: 100vh;
        }
        .card{
            font-family: Arial, Helvetica, sans-serif;
            width: 100%;
            max-width: 800px;
            border: 1px solid #dddddd;
            display: block;
            background-color: #ffffff;
            border-radius: 15px;
            padding: 20px;
            margin-top: 10vh;
        }
        .card-head{
            border-bottom: 1px solid #dddddd;
            margin-bottom: 20px;
        }
        .card-head h2{
            margin: 0;
            margin-bottom: 15px;
        }
        .card-body{
            margin-top: 20px;
        }
        .tip{
            line-height: 30px;
            font-style: italic;
            margin: 0;
            margin-bottom: 15px;
        }
        .message{
            margin: 0;
            margin-bottom: 5px;
            font-weight: bold;
        }
            .detail{
            font-family: Consolas, Monaco, monospace;
            font-size: 13px;
            background-color: #f6f8fa;
            border: 1px solid #dddddd;
            border-radius: 8px;
            padding: 10px;
            white-space: pre-wrap;
            word-break: break-word;
        }
        ul.hints{
            line-height: 26px;
            padding-left: 20px;
        }
        code{
            background-color: #f6f8fa;
            padding: 1px 4px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <div class="card">
            <div class="card-head">
                <h2>Database server unavailable</h2>
            </div>
            <div class="card-body">
                <p class="message"><?= htmlspecialchars((string) ($message ?? 'A database error occurred.'), ENT_QUOTES, 'UTF-8') ?><?php if (!empty($errorCode)): ?> (error <?= (int) $errorCode ?>)<?php endif; ?></p>
                <p class="tip">The website could not reach its database server. Please try again in a moment.</p>
                <ul class="hints">
                    <li>Check that MySQL/MariaDB is running (in XAMPP: start <b>MySQL</b> in the Control Panel).</li>
                    <li>Check <code>DB_HOST</code> and <code>DB_PORT</code> in <code>.env</code>.</li>
                </ul>
                <?php if (!empty($detail)): ?>
                <p class="message">Driver message (shown because APP_DEBUG=true):</p>
                <div class="detail"><?= htmlspecialchars((string) $detail, ENT_QUOTES, 'UTF-8') ?></div>
                <?php endif; ?>
            </div>
        </div>
    </div>
</body>
</html>
