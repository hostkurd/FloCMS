<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>File Missing</title>
  <style>
    body { font-family: Arial; background:#f3f6f9; }
    .box { max-width: 900px; margin: 60px auto; background:#fff; padding:24px; border-radius:10px; }
    .msg { background:#f6f6f6; border:1px solid #ddd; padding:12px; border-radius:8px; white-space: pre-wrap; }
    .msg p{
      font-size: 1rem;
      color: red;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>Required file is missing</h1>
    <p>The application cannot start because a required file was not found.</p>
    <div class="msg"><p>({{path}})</p>{{message}}</div>
  </div>
</body>
</html>
