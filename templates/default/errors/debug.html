<!DOCTYPE html>
    <html lang='en'>
    <head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title><?= $type ?>: <?= $message ?></title>
    <style>
        :root{
            --bg:#0f1220; --panel:#161a2b; --panel2:#121628; --txt:#e7e9ee;
            --muted:#aab0c0; --accent:#7aa2f7; --danger:#ff6b6b; --good:#4ec9b0;
            --border:rgba(255,255,255,.08);
            --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
            --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, 'Apple Color Emoji','Segoe UI Emoji';
        }
        *{box-sizing:border-box}
        body{margin:0; font-family:var(--sans); background:linear-gradient(180deg,#0b0e1a, var(--bg)); color:var(--txt);min-height: 100vh;}
        a{color:var(--accent); text-decoration:none}
        .wrap{max-width:1200px; margin:0 auto; padding:28px;}
        .top{
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:16px;
            padding:20px 20px;
            box-shadow:0 18px 50px rgba(0,0,0,.35);
        }
        .badge{display:inline-block; font-size:12px; padding:4px 10px; border-radius:999px; border:1px solid var(--border); color:var(--muted)}
        .title{margin:10px 0 6px; font-size:22px; line-height:1.25}
        .subtitle{color:var(--muted); font-family:var(--mono); font-size:13px}
        .grid{display:grid; grid-template-columns: 1.35fr .65fr; gap:16px; margin-top:16px;}
        @media (max-width: 960px){ .grid{grid-template-columns:1fr;} }
        .card{
            background:var(--panel);
            border:1px solid var(--border);
            border-radius:16px;
            overflow:hidden;
        }
        .card h3{
            margin:0;
            padding:12px 14px;
            font-size:13px;
            letter-spacing:.02em;
            text-transform:uppercase;
            color:var(--muted);
            background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,0));
            border-bottom:1px solid var(--border);
        }
        .card .body{padding:14px;}
        .code{
            font-family:var(--mono);
            font-size:13px;
            line-height:1.6;
            background:var(--panel2);
            border:1px solid var(--border);
            border-radius:12px;
            overflow:auto;
        }
        .code .row{
            display:grid;
            grid-template-columns: 70px 1fr;
            gap:0;
            border-bottom:1px solid rgba(255,255,255,.05);
            padding:0;
        }
        .code .ln{
            text-align:right;
            padding:8px 10px;
            color:var(--muted);
            user-select:none;
            border-right:1px solid rgba(255,255,255,.06);
            background:rgba(255,255,255,.02);
        }
        .code .src{
            padding:8px 12px;
            white-space:pre;
            overflow:auto;
        }
        .code .hit{background:rgba(255,107,107,.12);}
        .code .hit .ln{color:var(--danger); font-weight:700;}
        .code .hit .src{outline:1px solid rgba(255,107,107,.25);}
        .kv{
            width:100%;
            border-collapse:collapse;
            font-family:var(--mono);
            font-size:12px;
        }
        .kv td{
            padding:8px 10px;
            vertical-align:top;
            border-bottom:1px solid rgba(255,255,255,.06);
        }
        .kv td:first-child{color:var(--muted); width:34%;}
        .pill{display:inline-block; padding:2px 8px; border-radius:999px; border:1px solid var(--border); color:var(--muted); font-family:var(--mono); font-size:12px;}
        details{border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,.02); overflow:hidden;}
        summary{
            cursor:pointer;
            padding:10px 12px;
            font-family:var(--mono);
            font-size:12px;
            color:var(--muted);
            list-style:none;
            display:flex;
            align-items:center;
            justify-content:space-between;
            gap:10px;
        }
        summary::-webkit-details-marker{display:none;}
        .details-body{padding:12px; border-top:1px solid rgba(255,255,255,.06);}
        pre{
            margin:0;
            white-space:pre-wrap;
            word-break:break-word;
            font-family:var(--mono);
            font-size:12px;
            line-height:1.5;
            color:var(--txt);
        }
        .trace-item{
            border:1px solid rgba(255,255,255,.07);
            border-radius:12px;
            padding:10px 12px;
            margin-bottom:10px;
            background:rgba(255,255,255,.02);
            font-family:var(--mono);
            font-size:12px;
        }
        .trace-head{display:flex; justify-content:space-between; gap:10px; color:var(--muted);}
        .trace-main{margin-top:6px; color:var(--txt);}
        .trace-file{color:var(--good);}
        .muted{color:var(--muted);}
        .footer{padding: 10px 0;font-size: 12px;width: 100%;text-align: center;color: var(--muted);}
    </style>
    </head>
    <body>
    <div class='wrap'>
        <div class='top'>
            <span class='badge'>HTTP <?=$status?></span>
            <div class='title'><span style='color:var(--danger)'><?=$type?></span>: <?=$message?></div>
            <div class='subtitle'><?=$fileEsc?> : <?=$line?></div>
        </div>

        <div class='grid'>
            <div class='card'>
                <h3><?=$codeTitle?></h3>
                <div class='body'>
                    <?=$codeHtml?>
                </div>
            </div>

            <div class='card'>
                <h3>Request</h3>
                <div class='body'>
                    <?=$reqHtml?>
                </div>
            </div>
        </div>

        <div class='grid'>
            <div class='card'>
                <h3>Stack Trace</h3>
                <div class='body'>
                    <?=$traceHtml?>
                </div>
            </div>

            <div class='card'>
                <h3>Globals</h3>
                <div class='body' style='display:flex; flex-direction:column; gap:10px;'>
                    <?=$sessionHtml?>
                    <?=$getHtml?>
                    <?=$postHtml?>
                    <?=$serverHtml?>
                </div>
            </div>
        </div>
        <div class="footer"><span style="font-weight: 600;">FLOCMS</span> Debug Console. Generated on: <?=date('m/d/Y h:i:s a', time());?></div>
    </div>
    </body>
    </html>
