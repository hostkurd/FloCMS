name: Tests

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    name: PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Keep LF line endings on Windows
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      # The extensions FloCMS requires on shared hosting, plus pdo_sqlite and
      # curl for the tests.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, fileinfo, gd, curl
          coverage: none
          tools: composer:v2

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        shell: bash
        run: |
          php -l flo > /dev/null
          find commands config controllers includes models public support tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Smoke test the flo launcher
        shell: bash
        run: |
          php flo list > /dev/null
          php flo setup --as=api-admin --dry-run > /dev/null
          set +e
          php flo no-such-command 2> /dev/null
          code=$?
          set -e
          test "$code" = "1" || { echo "unknown command exited with $code, expected 1"; exit 1; }

      # The feature tests run copies of the site under PHP's built-in server
      # and symlink vendor/, so Windows runs the unit tests.
      - name: Run tests
        if: runner.os == 'Linux'
        run: vendor/bin/phpunit

      - name: Run unit tests
        if: runner.os == 'Windows'
        run: vendor/bin/phpunit --testsuite unit

  # 2.0: the API is optional. Add it the way `php flo setup` does and run the
  # tests again, the API's included (the copies run `php flo api:install`).
  api:
    name: With flocms-api (PHP 8.3)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, fileinfo, gd, curl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      # Until flocms-api 1.3.0 and flocms-core 2.8.0 are on Packagist, use their branches
      - name: Add flocms-api
        shell: bash
        run: |
          if composer show --all --no-interaction hostkurd/flocms-api 1.3.0 > /dev/null 2>&1; then
            composer require --no-interaction --no-progress "hostkurd/flocms-api:^1.3"
          else
            composer config repositories.flocms-api vcs https://github.com/hostkurd/flocms-api
            composer config repositories.flocms-core vcs https://github.com/hostkurd/flocms-core
            composer require --no-interaction --no-progress -W "hostkurd/flocms-api:dev-feat/api-1.3-core-tools as 1.3.0" "hostkurd/flocms-core:dev-feat/core-2.8-security-tools as 2.8.0"
          fi
          php flo api:list > /dev/null
          # The tests check the skeleton's own composer.json and composer.lock
          git checkout -- composer.json composer.lock

      # locked-versions: tests of the versions composer.lock installs
      - name: Run tests
        run: vendor/bin/phpunit --exclude-group locked-versions

  mysql:
    name: ${{ matrix.db.name }} (PHP 8.3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - { name: 'MariaDB 10.11', image: 'mariadb:10.11' }
          - { name: 'MySQL 8.0', image: 'mysql:8.0' }

    services:
      db:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MARIADB_ROOT_PASSWORD: root
          MYSQL_DATABASE: flocms_test
          MARIADB_DATABASE: flocms_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot || mariadb-admin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, pdo_sqlite, mbstring, fileinfo, gd, curl
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run the tests against ${{ matrix.db.name }}
        env:
          FLO_TEST_MYSQL_HOST: 127.0.0.1
          FLO_TEST_MYSQL_PORT: 3306
          FLO_TEST_MYSQL_USER: root
          FLO_TEST_MYSQL_PASS: root
          FLO_TEST_MYSQL_NAME: flocms_test
        run: vendor/bin/phpunit
